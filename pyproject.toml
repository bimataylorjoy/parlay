[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parlay-research"
version = "0.2.0"
description = "Time-safe football probability research framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "bimataylorjoy", email = "bimataylorjoy@users.noreply.github.com"},
]
maintainers = [
  {name = "bimataylorjoy", email = "bimataylorjoy@users.noreply.github.com"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
bayes = ["pymc>=5.10", "arviz>=0.17"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.5"]

[project.scripts]
parlay = "parlay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parlay = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: long-running statistical tests",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001",  # ambiguous unicode in strings (Greek letters in docs are intentional)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["parlay"]

[tool.mypy]
python_version = "3.10"
files = ["src/parlay"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["parlay"]
branch = true
